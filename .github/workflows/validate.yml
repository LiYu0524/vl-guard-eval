name: Validate published results

on:
  push:
  pull_request:

jobs:
  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce published statistics
        run: python3 scripts/reproduce.py --output-dir reproduction --nboot 1000 --seed 20261013
      - name: Reproduce four-model comparison
        run: >-
          python3 scripts/reproduce.py
          --models qwen3.8-27b deepseek-v4.1-flash qwen3.5-27b qwen3.6-27b
          --output-dir reproduction/qwen35_qwen36
          --reference-summary results/2026-10-13-qwen35-qwen36/summary.json
          --nboot 1000 --seed 20261013
      - name: Reproduce GUI baseline statistics
        run: python3 results/gui-2026-10-14-baseline/reproduce.py
      - name: Reproduce GUI 175 rerun statistics
        run: python3 results/gui-web175-2026-10-14-rerun/reproduce.py
