name: Validate published results

on:
  push:
  pull_request:

jobs:
  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce published statistics
        run: python3 scripts/reproduce.py --output-dir reproduction --nboot 1000 --seed 20261013
